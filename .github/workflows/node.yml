name: 'Tests: node.js >= 26.8'

on: [pull_request, push]

permissions:
  contents: read

jobs:
  tests:
    uses: ljharb/actions/.github/workflows/node.yml@main
    with:
      range: '>= 26.8'
      type: minors
      command: npm run tests-only

  node:
    name: 'node >= 26.8'
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - run: true
